      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

  # ── dristi-monolith application ────────────────────────────────────────────
  dristi-app:
    image: ${DOCKER_REPO_EGOV_DRISTI}:${DOCKER_TAG_EGOV_DRISTI}
    container_name: dristi-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      # dristi-app-db:
      #   condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      # ── JVM ───────────────────────────────────────────────────────────────
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1g}

      # ── Spring active profiles ────────────────────────────────────────────
      # "local" profile is excluded here; the compose file sets individual vars
      # instead. Override SPRING_PROFILES_ACTIVE to add extra profiles.
      SPRING_PROFILES_ACTIVE: >-
        shared,transformer,cases,locksvc,order,bank,notification,
        templateconfiguration,advocate,abdiary,epost,calculator,
        inportalsurvey,bailbond,digitalizeddocuments,advocateoffice,
        esign,ctc,treasury,application,hearing,task,taskmanagement,
        evidence,casemanagement,analytics,ordermanagement,summons,njdg,
        scheduler,hearingmanagement,icops

      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_WRITER_URL:              ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_WRITER_USERNAME:         ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_WRITER_PASSWORD:         ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_WRITER_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_READER_URL:              ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_READER_USERNAME:         ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_READER_PASSWORD:         ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_READER_DRIVER_CLASS_NAME: org.postgresql.Driver

      # ── Flyway ────────────────────────────────────────────────────────────
      SPRING_FLYWAY_ENABLED:  "true"
      SPRING_FLYWAY_URL:      ${SPRING_DATASOURCE_URL}
      SPRING_FLYWAY_USER:     ${SPRING_DATASOURCE_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ── Kafka / Redpanda ──────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      # ── Redis ─────────────────────────────────────────────────────────────
      SPRING_REDIS_HOST:    ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT:    ${SPRING_REDIS_PORT}
      SPRING_REDIS_TIMEOUT: 10

      # ── eGov / DIGIT platform hosts ───────────────────────────────────────
      EGOV_USER_HOST:             ${EGOV_USER_HOST}
      # EGOV_USER_CONTEXT_PATH:     ${EGOV_USER_CONTEXT_PATH:-/user/users}
      # EGOV_USER_CREATE_PATH:      ${EGOV_USER_CREATE_PATH:=/_createnovalidate}
      # EGOV_USER_SEARCH_PATH:      ${EGOV_USER_SEARCH_PATH:-/user/v1/_search}
      # EGOV_USER_UPDATE_PATH:      ${EGOV_USER_UPDATE_PATH:-/_updatenovalidate}

      EGOV_MDMS_HOST:             ${EGOV_MDMS_HOST}
      # EGOV_MDMS_SEARCH_ENDPOINT:  ${EGOV_MDMS_SEARCH_ENDPOINT:-/egov-mdms-service/v1/_search}
      # EGOV_MDMS_V2_SEARCH_ENDPOINT: ${EGOV_MDMS_V2_SEARCH_ENDPOINT:-/egov-mdms-service/v2/_search}

      EGOV_IDGEN_HOST:            ${EGOV_IDGEN_HOST}
      # EGOV_IDGEN_PATH:            ${EGOV_IDGEN_PATH:-/egov-idgen/id/_generate}

      EGOV_INDIVIDUAL_HOST:       ${EGOV_INDIVIDUAL_HOST}
      # EGOV_INDIVIDUAL_SEARCH_PATH: ${EGOV_INDIVIDUAL_SEARCH_PATH:-individual/v1/_search}

      EGOV_FILESTORE_HOST:        ${EGOV_FILESTORE_HOST}
      # EGOV_FILESTORE_PATH:        ${EGOV_FILESTORE_PATH:-/filestore/v1/files}

      EGOV_WORKFLOW_HOST:         ${EGOV_WORKFLOW_HOST}
      # EGOV_WORKFLOW_TRANSITION_PATH: ${EGOV_WORKFLOW_TRANSITION_PATH:-/egov-workflow-v2/egov-wf/process/_transition}
      # EGOV_WORKFLOW_BUSINESSSERVICE_SEARCH_PATH: ${EGOV_WORKFLOW_BUSINESSSERVICE_SEARCH_PATH:-/egov-workflow-v2/egov-wf/businessservice/_search}

      EGOV_HRMS_HOST:             ${EGOV_HRMS_HOST}
      # EGOV_HRMS_SEARCH_ENDPOINT:  ${EGOV_HRMS_SEARCH_ENDPOINT:-/egov-hrms/employees/_search}

      EGOV_URL_SHORTNER_HOST:     ${EGOV_URL_SHORTENING}
      # EGOV_URL_SHORTNER_ENDPOINT: ${EGOV_URL_SHORTNER_ENDPOINT:-/egov-url-shortening/shortener}

      # ── Encryption service ────────────────────────────────────────────────
      EGOV_ENC_HOST:              ${EGOV_ENC_SERVICE_HOST}
      # EGOV_ENC_ENCRYPT_ENDPOINT:  ${EGOV_ENC_ENCRYPT_ENDPOINT:-/egov-enc-service/crypto/v1/_encrypt}
      # EGOV_ENC_DECRYPT_ENDPOINT:  ${EGOV_ENC_DECRYPT_ENDPOINT:-/egov-enc-service/crypto/v1/_decrypt}

      # ── State / tenant ────────────────────────────────────────────────────
      STATE_LEVEL_TENANT_ID:      ${STATE_LEVEL_TENANT_ID:-pb}
      EGOV_COURT_ID:              ${EGOV_COURT_ID:-KLKM52}

      # ── Billing / payment ─────────────────────────────────────────────────
      EGOV_BILLING_HOST:          ${EGOV_BILLING_HOST}
      # EGOV_DEMAND_CREATE_ENDPOINT: ${EGOV_DEMAND_CREATE_ENDPOINT:-/billing-service/demand/_create}

      # ── Lock service ──────────────────────────────────────────────────────
      PUCAR_LOCK_DURATION:        ${PUCAR_LOCK_DURATION:-1200000}
      PUCAR_LOCK_HOST:            http://dristi-app:8080/
      PUCAR_LOCK_SEARCH_ENDPOINT: /lock-svc/v1/_get

      # ── OpenTelemetry (disable for local) ─────────────────────────────────
      OTEL_TRACES_EXPORTER:   none
      OTEL_METRICS_EXPORTER:  none
      OTEL_LOGS_EXPORTER:     none

      # ── Logging ───────────────────────────────────────────────────────────
      LOGGING_LEVEL_ROOT:          ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_ORG_PUCAR:     ${LOGGING_LEVEL_ORG_PUCAR:-DEBUG}

  caddy:
    image: caddy:2
    container_name: caddy-gateway
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "18000:8000"
      - "10080:80"
      - "10443:443"
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    networks:
      - egov-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      # Jaeger UI (HTTP) - Open this in your browser
      - "16686:16686"
      # OpenTelemetry Protocol (OTLP) gRPC receiver
      - "4317:4317"
      # OpenTelemetry Protocol (OTLP) HTTP receiver
      - "4318:4318"
      # Thrift HTTP receiver (Legacy)
      - "14268:14268"
      # Zipkin compact HTTP receiver (Legacy)
      - "9411:9411"
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: --base-url /portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - portainer_data:/
    ports:
      - "9099:9000"
    networks:
      - egov-network

networks:
  egov-network:
    driver: bridge

volumes:
  postgres_data: null
  minio_data: null
  portainer_data: null