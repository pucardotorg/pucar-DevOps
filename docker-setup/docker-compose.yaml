# Laptop-local DIGIT core stack (Docker Compose + optional Tilt).
# Aligns with egovernments/DIGIT-DevOps (e.g. unified-demo / studio Helm charts) for env wiring.
#
# Studio / sandbox images: override in shell or `.env` (client-supplied tags). Defaults match
# Studio-services-builds.pdf naming; replace tags without changing env blocks.
#   IMAGE_MDMS_V2, IMAGE_EGOV_USER, IMAGE_EGOV_WORKFLOW_V2, IMAGE_EGOV_HRMS,
#   IMAGE_DIGIT_STUDIO, IMAGE_PUBLIC_SERVICE_INIT, IMAGE_PUBLIC_SERVICE, IMAGE_INBOX,
#   IMAGE_HEALTH_INDIVIDUAL, IMAGE_HEALTH_SERVICE_REQUEST, IMAGE_STUDIO_PDF,
#   IMAGE_EGOV_OTP, IMAGE_PDF_SERVICE, IMAGE_USER_OTP, IMAGE_EGOV_NOTIFICATION_SMS
services:

  redis:
    image: redis:7.2.4
    container_name: redis
    ports:
      - 16379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - egov-network

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 256M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082
    ports:
      - 19092:9092
      - 18082:8082
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
    networks:
      egov-network:
        aliases:
          - kafka
          - kafka-v2.kafka-cluster

  # git-sync:
  #   image: ${GIT_SYNC_IMAGE:-registry.k8s.io/git-sync/git-sync:v3.6.9}
  #   container_name: git-sync
  #   user: "0:0"
  #   environment:
  #     GIT_SYNC_REPO: ${GIT_SYNC_REPO}
  #     GIT_SYNC_BRANCH: ${GIT_SYNC_BRANCH}
  #     GIT_SYNC_DEPTH: ${GIT_SYNC_DEPTH}
  #     GIT_SYNC_ONE_TIME: ${GIT_SYNC_ONE_TIME}
  #     GIT_SYNC_SSH: ${GIT_SYNC_SSH}
  #     GIT_SYNC_ROOT: ${GIT_SYNC_ROOT}
  #     GIT_SYNC_VERBOSE: "5"
  #     GIT_SYNC_SSH_KNOWN_HOSTS: "false"
  #   networks:
  #     - egov-network
  #   volumes:
  #     - ./app-config:/tmp/git
  #     - ./git-sync/ssh:/etc/git-secret/ssh
  #     - ./git-sync/known_hosts:/etc/git-secret/known_hosts
  #   restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "19200:9200"
    healthcheck:
      # Wait until cluster status is yellow or green (single-node clusters often stay yellow).
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\"\\s*:\\s*\"(green|yellow)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1"
    networks:
      - egov-network

  kibana:
    image: kibana:8.11.3
    container_name: kibana
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - 5601:5601
    networks:
      - egov-network

  audit-service-db:
    image: ${DOCKER_REPO_AUDIT_SERVICE}-db:${DOCKER_TAG_AUDIT_SERVICE:-latest}
    container_name: audit-service-db
    environment:
      DB_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}
      SCHEMA_TABLE: audit_service_schema
      FLYWAY_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
    networks:
      - egov-network
    restart: on-failure

  audit-service:
    image: ${IMAGE_AUDIT_SERVICE:-docker.io/venkatramireddyb/audit-service:main-9eaace654285377eed8a7686eb71e16420152faa}
    container_name: audit-service
    depends_on:
      audit-service-db:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_CONSUMER_GROUP_ID: audit-service
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      PROCESS_AUDIT_LOGS_KAFKA_TOPIC: process-audit-records
      PERSIST_AUDIT_LOGS_KAFKA_TOPIC: persist-audit-records
      JAVA_OPTS: -Xmx64m -Xms64m
      SERVER_PORT: 8080
      JAVA_ARGS: ${JAVA_ARGS:--Dspring.profiles.active=monitoring}
      SECURITY_BASIC_ENABLED: false
      MANAGEMENT_SECURITY_ENABLED: false
      EGOV_ENC_SIGN_HOST: ${EGOV_ENC_SERVICE_HOST:-http://egov-enc-service:8080/}
      EGOV_PERSIST_YML_REPO_PATH: ${EGOV_PERSIST_YML_REPO_PATH}
      FLYWAY_ENABLED: false
      SPRING_FLYWAY_ENABLED: false
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: /
      APP_TIMEZONE: ${APP_TIMEZONE}
      FLYWAY_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}                                       
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}                                       
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}                                                 
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}                                                  
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE: ${SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE}        
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS}                
      SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE: ${SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE}          
      SPRING_DATASOURCE_HIKARI_MAXIMUM- -SIZE:   ${SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE}          
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}        
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}        
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}        
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}  
      KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG: ${KAFKA_BOOTSTRAP_SERVERS}                                
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}                                
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}                          
      STATE_LEVEL_TENANTID_LENGTH: 1
      IS_ENVIRONMENT_CENTRAL_INSTANCE: false
      STATE_SCHEMA_INDEX_POSITION_TENANTID: 0
      KAFKA_TOPIC_AUDIT: enc-user-audit-data
      LOGGING_LOKI_ENABLED: true
      LOGGING_LOKI_URL: ${LOGGING_LOKI_URL}  
      LOGGING_LOKI_APP: (v1:metadata.name)
      LOGGING_LOKI_ENVIRONMENT: ${LOGGING_LOKI_ENVIRONMENT}
      LOGGING_LEVEL_ROOT: INFO
      OTEL_SERVICE_NAME: audit-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    volumes:
      - ./git-sync:/git-sync
    networks:
      - egov-network
    restart: unless-stopped

  billing-service-db:
    image: ${DOCKER_REPO_BILLING_SERVICE}-db:${DOCKER_TAG_BILLING_SERVICE:-latest}
    container_name: billing-service-db
    environment:
      DB_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}
      SCHEMA_TABLE: billing_service_schema
      FLYWAY_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
    networks:
      - egov-network
    restart: on-failure
  
  billing-service:
    image: ${DOCKER_REPO_BILLING_SERVICE}:${DOCKER_TAG_BILLING_SERVICE}
    container_name: billing-service
    environment:
      SPRING_FLYWAY_URL:                            ${SPRING_DATASOURCE_URL}
      SPRING_FLYWAY_USER:                           ${SPRING_DATASOURCE_USERNAME}
      SPRING_FLYWAY_PASSWORD:                       ${SPRING_DATASOURCE_PASSWORD}
      SCHEMA_TABLE:                                 billing_service_schema
      EGOV_IDGEN_HOST:                              ${EGOV_IDGEN_HOST}
      USER_SERVICE_HOSTNAME:                        ${USER_SERVICE_HOSTNAME}
      EGOV_HRMS_HOST:                               ${EGOV_HRMS_HOST}
      EGOV_MDMS_HOST:                               ${EGOV_MDMS_HOST}
      EGOV_LOCALIZATION_HOST:                       ${EGOV_LOCALIZATION_HOST}
      SERVER_PORT:                                  8080
      SERVER_CONTEXT_PATH:                          /billing-service
      EGOV_IDGEN_PATH:                              egov-idgen/id/_generate
      EGOV_INDIVIDUAL_HOST:                         ${EGOV_INDIVIDUAL_HOST}
      EGOV_WORKFLOW_HOST:                           ${EGOV_WORKFLOW_HOST}
      EGOV_URL_SHORTNER:                            ${EGOV_URL_SHORTENING}
      EGOV_APPORTION_HOST:                          ${EGOV_APPORTION_HOST}
      STATELEVEL_ROLECODE_EXCLUDED_LIST:            PAYMENT_COLLECTOR,BPAREG_DOC_VERIFIER,BPAREG_APPROVER
      FLYWAY_ENABLED:                               false
      SPRING_FLYWAY_ENABLED:                        false
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:           /
      APP_TIMEZONE:                                 ${APP_TIMEZONE}
      FLYWAY_URL:                                   ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_URL:                        ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME:                   ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD:                   ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE:        ${SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE}         
      SERVER_TOMCAT_MAX_THREADS:                    ${SERVER_TOMCAT_MAX_THREADS}                    
      SERVER_TOMCAT_MAX_CONNECTIONS:                ${SERVER_TOMCAT_MAX_CONNECTIONS}                
      SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE:          ${SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE}          
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:   ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}          
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:        ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}        
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:        ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:        ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}        
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:  ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}  
      KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG:         ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS:               ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_JPA_SHOW_SQL:                          ${SPRING_JPA_SHOW_SQL}                          
      STATE_LEVEL_TENANTID_LENGTH:                  1
      IS_ENVIRONMENT_CENTRAL_INSTANCE:              false
      STATE_SCHEMA_INDEX_POSITION_TENANTID:         0
      KAFKA_TOPIC_AUDIT:                            enc-user-audit-data
      LOGGING_LOKI_ENABLED:                         true
      LOGGING_LOKI_URL:                             ${LOGGING_LOKI_URL}
      LOGGING_LOKI_APP:                              (v1:metadata.name)
      LOGGING_LOKI_ENVIRONMENT:                     ${LOGGING_LOKI_ENVIRONMENT}
      LOGGING_LEVEL_ROOT:                           INFO
      OTEL_SERVICE_NAME:                            billing-service
      OTEL_EXPORTER_OTLP_ENDPOINT:                  ${OTEL_EXPORTER_OTLP_ENDPOINT}  
    networks:
      - egov-network
    depends_on:
      - billing-service-db
    restart: unless-stopped

  collection-services-db:
    image: ${DOCKER_REPO_COLLECTION_SERVICES}-db:${DOCKER_TAG_COLLECTION_SERVICES:-latest}
    container_name: collection-services-db
    environment:
      DB_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}
      SCHEMA_TABLE: collection_services_schema
      FLYWAY_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
    networks:
      - egov-network
    restart: on-failure

  collection-services:
    image: ${DOCKER_REPO_COLLECTION_SERVICES}:${DOCKER_TAG_COLLECTION_SERVICES}
    container_name: collection-services
    environment:
      JAVA_OPTS:                                    -Xmx64m -Xms64m
      SERVER_PORT:                                  8080
      JAVA_ARGS:                                    -Dspring.profiles.active=monitoring
      SPRING_DATASOURCE_URL:                        ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME:                   ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD:                   ${SPRING_DATASOURCE_PASSWORD}
      SCHEMA_TABLE:                                 collection_services_schema
      EGOV_IDGEN_HOSTNAME:                          ${EGOV_IDGEN_HOST}
      USER_SERVICE_HOST:                            ${USER_SERVICE_HOSTNAME}
      EGOV_HRMS_HOST:                               ${EGOV_HRMS_HOST}
      EGOV_MDMS_HOST:                               ${EGOV_MDMS_HOST}
      EGOV_LOCALIZATION_HOST:                       ${EGOV_LOCALIZATION_HOST}
      EGOV_INDIVIDUAL_HOST:                         ${EGOV_INDIVIDUAL_HOST}
      EGOV_WORKFLOW_HOST:                           ${EGOV_WORKFLOW_V2}
      EGOV_SERVICES_BILLING_SERVICE_HOSTNAME:       ${EGOV_BILLING_HOST}
      EGOV_URL_SHORTNER:                            ${EGOV_URL_SHORTENING}
      EGOV_APPORTION_SERVICE_HOST:                  ${EGOV_APPORTION_HOST}
      FLYWAY_ENABLED:                               false
      SPRING_FLYWAY_ENABLED:                        false
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:           /
      APP_TIMEZONE:                                 ${APP_TIMEZONE}
      FLYWAY_URL:                                   ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE:        ${SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE}
      SERVER_TOMCAT_MAX_THREADS:                    ${SERVER_TOMCAT_MAX_THREADS}
      SERVER_TOMCAT_MAX_CONNECTIONS:                ${SERVER_TOMCAT_MAX_CONNECTIONS}
      SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE:          ${SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE}
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:   ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:        ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:        ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:        ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:  ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
      KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG:         ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS:               ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_JPA_SHOW_SQL:                          ${SPRING_JPA_SHOW_SQL}
      STATE_LEVEL_TENANTID_LENGTH:                  1
      IS_ENVIRONMENT_CENTRAL_INSTANCE:              false
      STATE_SCHEMA_INDEX_POSITION_TENANTID:         0
      KAFKA_TOPIC_AUDIT:                            enc-user-audit-data
      LOGGING_LOKI_ENABLED:                         true
      LOGGING_LOKI_URL:                             ${LOGGING_LOKI_URL}
      LOGGING_LOKI_APP:                              (v1:metadata.name)
      LOGGING_LOKI_ENVIRONMENT:                     ${LOGGING_LOKI_ENVIRONMENT}
      LOGGING_LEVEL_ROOT:                           ${LOGGING_LEVEL_ROOT}
      OTEL_SERVICE_NAME:                            collection-services
      OTEL_EXPORTER_OTLP_ENDPOINT:                  ${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks:
      - egov-network
    depends_on:
      - collection-services-db
    restart: unless-stopped

  egov-accesscontrol:
    image: ${DOCKER_REPO_EGOV_ACCESSCONTROL}:${DOCKER_TAG_EGOV_ACCESSCONTROL}
    container_name: egov-accesscontrol
    depends_on:
      redpanda:
        condition: service_healthy
      egov-mdms-service:
        condition: service_healthy
    environment:
      SERVER_PORT:                                  8080
      JAVA_OPTS:                                    -Xmx192m -Xms192m
      EGOV_MDMS_HOST:                               ${EGOV_MDMS_HOST}  
      JAVA_ARGS:                                    ${JAVA_ARGS} 
      SECURITY_BASIC_ENABLED:                       false
      MANAGEMENT_SECURITY_ENABLED:                  false
      FLYWAY_ENABLED:                               false
      SPRING_FLYWAY_ENABLED:                        false
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:           /
      APP_TIMEZONE:                                 ${APP_TIMEZONE}
      FLYWAY_URL:                                   ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}                                       
      SPRING_DATASOURCE_URL:                        ${SPRING_DATASOURCE_URL:-jdbc:postgresql://178.236.185.120:5432/phc_db}                                       
      SPRING_DATASOURCE_USERNAME:                   ${SPRING_DATASOURCE_USERNAME:-postgres}                                                 
      SPRING_DATASOURCE_PASSWORD:                   ${SPRING_DATASOURCE_PASSWORD:-postgres}                                                  
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE:        ${SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE}          
      SERVER_TOMCAT_MAX_THREADS:                    ${SERVER_TOMCAT_MAX_THREADS}                    
      SERVER_TOMCAT_MAX_CONNECTIONS:                ${SERVER_TOMCAT_MAX_CONNECTIONS}                
      SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE:          ${SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE}          
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:   ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}          
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:        ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}        
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:        ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}        
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:        ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}        
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:  ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}  
      KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG:         ${KAFKA_BOOTSTRAP_SERVERS}                                
      SPRING_KAFKA_BOOTSTRAP_SERVERS:               ${KAFKA_BOOTSTRAP_SERVERS}                                
      SPRING_JPA_SHOW_SQL:                          ${SPRING_JPA_SHOW_SQL}                          
      STATE_LEVEL_TENANTID_LENGTH:                  1
      IS_ENVIRONMENT_CENTRAL_INSTANCE:              false
      STATE_SCHEMA_INDEX_POSITION_TENANTID:         0
      KAFKA_TOPIC_AUDIT:                            enc-user-audit-data
      LOGGING_LOKI_ENABLED:                         ${LOGGING_LOKI_ENABLED}
      LOGGING_LOKI_URL:                             ${LOGGING_LOKI_URL}
      LOGGING_LOKI_APP:                             (v1:metadata.name)
      LOGGING_LOKI_ENVIRONMENT:                     ${LOGGING_LOKI_ENVIRONMENT}
      LOGGING_LEVEL_ROOT:                           ${LOGGING_LEVEL_ROOT}
      OTEL_SERVICE_NAME:                            egov-accesscontrol
      OTEL_EXPORTER_OTLP_ENDPOINT:                  ${OTEL_EXPORTER_OTLP_ENDPOINT}
    # ports:
    #   - 18090:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/access/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    networks:
      - egov-network
  # MDMS Backend
  egov-mdms-service:
    image: ${IMAGE_EGOV_MDMS_SERVICE:-docker.io/venkatramireddyb/egov-mdms-service:main-d545e4ba420f6de7d63a8f064af94ba3746f9fdb}
    container_name: egov-mdms-service
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      SERVER_SERVLET_CONTEXT_PATH:                  /egov-mdms-service
      SERVER_CONTEXT_PATH:                          /egov-mdms-service
      SPRING_KAFKA_CONSUMER_GROUP_ID:               egov-mdms-service-consumer-group
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:         org.apache.kafka.common.serialization.StringSerializer
      JAVA_OPTS:                                    -Xmx512m -Xms512m
      JAVA_ARGS:                                    -Dspring.profiles.active=monitoring
      SERVER_PORT:                                  8080
      SECURITY_BASIC_ENABLED:                       false
      MANAGEMENT_SECURITY_ENABLED:                  false
      JAVA_ENABLE_DEBUG:                            true
      EGOV_MDMS_SCHEMA_DEFINITION_SAVE_TOPIC:       save-mdms-schema-definition
      EGOV_MDMS_DATA_SAVE_TOPIC:                    save-mdms-data
      MDMS_DEFAULT_OFFSET:                          0
      MDMS_DEFAULT_LIMIT:                           100
      FLYWAY_ENABLED:                               false
      SPRING_FLYWAY_ENABLED:                        false
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:           /
      APP_TIMEZONE:                                 ${APP_TIMEZONE}
      FLYWAY_URL:                                   ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_URL:                        ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME:                   ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD:                   ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE:        ${SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE}
      SERVER_TOMCAT_MAX_THREADS:                    ${SERVER_TOMCAT_MAX_THREADS}
      SERVER_TOMCAT_MAX_CONNECTIONS:                ${SERVER_TOMCAT_MAX_CONNECTIONS}
