apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "acme-challenge.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "acme-challenge.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | default .Values.global.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | default .Values.global.domain }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "acme-challenge.name" . }}-svc
                port:
                  number: {{ .Values.service.port }}
