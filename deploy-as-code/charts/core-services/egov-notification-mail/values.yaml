# Common Labels
labels:
  app: "egov-notification-mail"
  group: "core"

# Init Containers Configs
initContainers: {}

lokiEnabled: true
tracing-enabled: true
# Container Configs
image:
  repository: "egov-notification-mail"
  tag: develop-2b1e7f01cad463fed4459d4b9af0b10966263439
replicas: "1"
appType: "java-spring"
mail-port: 587
username: "egov-testing@egovernments.org"
heap: "-Xmx192m -Xms192m"
mail-smtps-debug: "true"
mail-smtps-auth: "true"
mail-smtps-ssl-enable: "false"
mail-smtps-starttls-enable: "true"
mail-sender-test: "false"
mail-protocol: "smtp"

# Additional Container Envs
env: |
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_NAME
    value: egov.core.notification.email
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_ID
    value: egov.core.notification.email
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_GROUP
    value: egov.core.notification.email
  - name: MAIL_SENDER_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername                   
  - name: MAIL_SENDER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword
  {{- if index .Values "mail-port" }}
  - name: MAIL_PORT
    value: {{ index .Values "mail-port" | quote }}
  - name: MAIL_HOST
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailhost
  {{- end }}        
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_USER_STATE_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id        
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_FROM_EMAIL
    valueFrom:
      secretKeyRef:
        key: mailsenderusername
        name: egov-notification-mail
  - name: MAIL_SMTPS_DEBUG
    value: {{ index .Values "mail-smtps-debug" | quote }}
  - name: MAIL_SMTPS_AUTH
    value: {{ index .Values "mail-smtps-auth" | quote }}
  - name: MAIL_PROTOCOL
    value: {{ index .Values "mail-protocol" | quote }}
  - name: MAIL_SMTPS_SSL_ENABLE
    value: {{ index .Values "mail-smtps-ssl-enable" | quote }}
  - name: MAIL_SMTPS_STARTTLS_ENABLE
    value: {{ index .Values "mail-smtps-starttls-enable" | quote }}
  - name: MAIL_SENDER_TEST
    value: {{ index .Values "mail-sender-test" | quote }}
  - name: TEST_EMAIL
    value: manimaaran@beehyv.com
