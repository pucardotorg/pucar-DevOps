# SMTP server stack — outbound mail relay for applications.
# Domain: emailsmtp.pucar.org (mail addresses: user@emailsmtp.pucar.org)
# SMTP ports are bound directly to the host (no nginx/Caddy proxy for TCP mail traffic).
# TLS cert is managed by Caddy (caddy_data volume, shared from the main docker-setup stack).
# Run setup helper after first start:
#   docker exec -it mailserver setup email add noreply@emailsmtp.pucar.org <password>
#   docker exec -it mailserver setup email add app-notify@emailsmtp.pucar.org <password>

name: pucar-smtp

services:

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: emailsmtp.pucar.org
    ports:
      - "127.0.0.1:10025:25"   # SMTP  — nginx stream :25 → 127.0.0.1:10025
      - "127.0.0.1:10465:465"  # SMTPS — nginx stream :465 → 127.0.0.1:10465
      - "127.0.0.1:10587:587"  # Submission — nginx stream :587 → 127.0.0.1:10587
    volumes:
      # - ./data/mail-data:/var/mail
      # - ./data/mail-state:/var/mail-state
      # - ./data/mail-logs:/var/log/mail
      # - ./data/config:/tmp/docker-mailserver
      # Persist OpenDKIM config (KeyTable, SigningTable, keys) across container restarts.
      # - ./data/opendkim:/etc/opendkim
      # Caddy cert volume — shared from the main docker-setup stack (name: caddy_data).
      # Caddy stores certs at /data/certificates/acme-v02.api.letsencrypt.org-directory/<domain>/
      - caddy_data:/caddy-certs:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # --- TLS (cert sourced from Caddy's data volume) ---
      SSL_TYPE: manual
      SSL_CERT_PATH: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/emailsmtp.pucar.org/emailsmtp.pucar.org.crt
      SSL_KEY_PATH: /caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/emailsmtp.pucar.org/emailsmtp.pucar.org.key
      # --- Spam / antivirus ---
      ENABLE_RSPAMD: "1"
      ENABLE_AMAVIS: "0"
      ENABLE_CLAMAV: "0"
      # --- Security ---
      ENABLE_FAIL2BAN: "1"
      SPOOF_PROTECTION: "1"
      PERMIT_DOCKER: network      # allow containers on the same host to relay
      # --- Network ---
      POSTFIX_INET_PROTOCOLS: ipv4
      # --- Identity ---
      POSTMASTER_ADDRESS: postmaster@emailsmtp.pucar.org
      # --- Misc ---
      ONE_DIR: "1"
      LOG_LEVEL: info
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "ss -lntp | grep -q ':25'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      docker-setup_egov-network:
        aliases:
          - emailsmtp.pucar.org   # makes this FQDN resolvable within Docker network

  # Roundcube — browser-based mail client (optional but useful for admin/testing).
  # Accessible at https://emailsmtp.pucar.org/roundcube via Caddy.
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      mailserver:
        condition: service_started
    # No host port binding needed — Caddy reaches roundcube:80 directly via docker-setup_egov-network.
    volumes:
      - ./data/roundcube:/var/roundcube/db
    environment:
      # emailsmtp.pucar.org resolves to the mailserver container within Docker
      # (hostname: emailsmtp + domainname: emailsmtp.pucar.org). TLS cert matches the domain
      # so hostname verification passes — no SSL workarounds needed.
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://emailsmtp.pucar.org
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://emailsmtp.pucar.org
      ROUNDCUBEMAIL_SMTP_PORT: "465"
      ROUNDCUBEMAIL_REQUEST_PATH: /roundcube
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    restart: unless-stopped
    networks:
      - docker-setup_egov-network

networks:
  docker-setup_egov-network:
    external: true   # shared with the main docker-setup compose stack

volumes:
  caddy_data:
    external: true
    name: caddy_data   # created by the main docker-setup stack
