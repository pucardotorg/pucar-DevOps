# ----------------------------------------------------------------
# SMTP port 587 (Submission / STARTTLS) — stream block in nginx.conf
# ----------------------------------------------------------------
# Port 587 CANNOT go in this file. /etc/nginx/sites-enabled/ is included
# by the http {} block only. Stream (raw TCP) config must live in the
# stream {} block inside /etc/nginx/nginx.conf.
#
# Add the following server blocks inside stream {} in /etc/nginx/nginx.conf:
#
#   server {
#       listen 25;
#       proxy_pass 127.0.0.1:10025;  # Docker binds 127.0.0.1:10025:25
#       proxy_timeout 3600s;
#       proxy_connect_timeout 10s;
#   }
#   server {
#       listen 465;
#       proxy_pass 127.0.0.1:10465;  # Docker binds 127.0.0.1:10465:465
#       proxy_timeout 3600s;
#       proxy_connect_timeout 10s;
#   }
#   server {
#       listen 587;
#       proxy_pass 127.0.0.1:10587;  # Docker binds 127.0.0.1:10587:587
#       proxy_timeout 3600s;
#       proxy_connect_timeout 10s;
#   }
#
# Docker binds mailserver ports to 127.0.0.1 on offset ports (10025/10465/10587)
# so there is zero conflict with nginx owning the standard external ports.
#
# Caddy is NOT in the path for SMTP — Caddy is HTTP/HTTPS only.
# Traffic flows: external client :587 -> nginx stream -> mailserver :587 directly.
# STARTTLS is handled entirely by Postfix inside the mailserver container.
#
# After editing nginx.conf:
#   sudo nginx -t && sudo systemctl reload nginx
# ----------------------------------------------------------------
