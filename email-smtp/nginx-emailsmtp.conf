# nginx sites-enabled config for emailsmtp.pucar.org
# Install: sudo cp nginx-emailsmtp.conf /etc/nginx/sites-enabled/emailsmtp.pucar.org
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# TLS is fully managed by Caddy (caddy_data volume). No certbot needed.
# Caddy auto-obtains and renews the cert for emailsmtp.pucar.org via ACME HTTP-01.
# nginx forwards ACME challenges to Caddy on port 10080 (see location block below).

# ----------------------------------------------------------------
# HTTP — ACME challenge + redirect to HTTPS
# ----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name emailsmtp.pucar.org;

    # Forward ACME challenge to Caddy so it can obtain/renew the TLS cert.
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------
# HTTPS — TLS termination, then forward to Caddy (which proxies to
# the Roundcube container in the email-smtp stack).
# Port 443 is handled by the stream block in nginx.conf (TLS passthrough
# to Caddy at 127.0.0.1:10443), so Caddy handles the cert and routing.
# No separate HTTPS server block is needed here because the stream
# block's `map $ssl_preread_server_name` already routes all SNI traffic
# to Caddy, including emailsmtp.pucar.org.
#
# If you ever want nginx to terminate TLS directly instead of passing
# through to Caddy, uncomment the block below and remove this domain
# from the Caddyfile.
# ----------------------------------------------------------------

